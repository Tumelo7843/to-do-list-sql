<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
    <style>
      :root{
        --bg1: #f6f9fc;
        --bg2: #e9f0ff;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #2563eb;
        --danger: #ef4444;
        --radius: 10px;
      }

      html,body{
        height:100%;
        margin:0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 100%);
        color:#111827;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      body{
        display:flex;
        align-items:center;
        justify-content:center;
        padding:40px 16px;
        box-sizing:border-box;
      }

      h1{
        margin:0 0 18px 0;
        font-size:20px;
        letter-spacing:0.6px;
        text-align:center;
        color:#0f172a;
      }

      /* card container look by styling the body children */
      #app {
        width:100%;
        max-width:640px;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), var(--card));
        border-radius: var(--radius);
        box-shadow: 0 8px 30px rgba(17,24,39,0.08);
        padding:22px;
        box-sizing:border-box;
      }

      /* input row */
      .input-row{
        display:flex;
        gap:10px;
        margin-bottom:16px;
      }

      #itemInput{
        flex:1 1 auto;
        padding:10px 12px;
        border:1px solid #e6e9ef;
        border-radius:8px;
        background:#fbfdff;
        font-size:14px;
        outline:none;
        transition:box-shadow .15s, border-color .15s;
      }
      #itemInput:focus{
        box-shadow:0 4px 10px rgba(37,99,235,0.08);
        border-color:var(--accent);
      }

      #addItemButton{
        appearance:none;
        border:0;
        background: linear-gradient(180deg,var(--accent), #1e40af);
        color:white;
        padding:10px 14px;
        border-radius:8px;
        font-weight:600;
        cursor:pointer;
        transition:transform .08s ease, box-shadow .08s;
      }
      #addItemButton:hover{ transform:translateY(-1px); }
      #addItemButton:active{ transform:translateY(0); }

      /* list */
      #shoppingList{
        list-style:none;
        margin:0;
        padding:0;
        display:block;
      }

      #shoppingList li{
        display:flex;
        gap:12px;
        align-items:center;
        justify-content:space-between;
        padding:12px 12px;
        border-radius:8px;
        margin-bottom:10px;
        background:linear-gradient(180deg, #ffffff, #fbfdff);
        border:1px solid #eef2f7;
        box-shadow: 0 2px 6px rgba(9,30,66,0.02);
        font-size:15px;
      }

      #shoppingList li .left{
        display:flex;
        gap:12px;
        align-items:center;
        flex:1 1 auto;
        min-width:0;
      }

      #shoppingList li span{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }

      /* select and delete button group */
      #shoppingList li .controls{
        display:flex;
        gap:8px;
        align-items:center;
      }

      select{
        padding:7px 10px;
        border-radius:8px;
        border:1px solid #e6e9ef;
        background:white;
        font-size:13px;
        color:#0f172a;
        outline:none;
        -moz-appearance:none;
        appearance:none;
      }

      /* priority coloring (option styling support varies by browser) */
      select option.high { color:#b91c1c; font-weight:600; }
      select option.medium { color:#b45309; font-weight:600; }
      select option.low { color:#065f46; font-weight:600; }

      button.remove {
        background:transparent;
        border:0;
        color:var(--danger);
        font-weight:700;
        cursor:pointer;
        padding:6px 8px;
        border-radius:6px;
      }
      button.remove:hover{
        background:rgba(239,68,68,0.08);
      }

      /* empty state */
      #shoppingList li.empty{
        justify-content:center;
        color:var(--muted);
        font-style:italic;
      }

      /* responsive */
      @media (max-width:480px){
        #addItemButton{ padding:10px 12px; }
        #shoppingList li{ padding:10px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>TO DO LIST</h1>
      <div class="input-row">
        <input type="text" id="itemInput" placeholder="Add new item" />
        <button id="addItemButton" onclick="addShoppingItem()">Add Item</button>
      </div>
      <ul id="shoppingList" onclick="editItem()"></ul>
    </div>
    <script>
      let db;
      async function initDb() {
            document.designMode = 'on';
        const SQL = (locateFile = await initSqlJs({
          locateFile: (file) =>
            `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${file}`,
        }));
        db = new SQL.Database();
        db.run(
          "CREATE TABLE shoppingList (id INTEGER PRIMARY KEY, item TEXT)"
        );
        console.log("Database initialized");
        displayShoppingList();
      }
      initDb();
      function addShoppingItem() {
        const item = document.getElementById("itemInput").value;
        
        if (item) {
          db.run("INSERT INTO shoppingList (item) VALUES (?)", [
            item,
          ]);
          console.log("Item added:", item);
        } else {
          console.log("Invalid input");
        }
        displayShoppingList();
      }
      function displayShoppingList() {
        
        const res = db.exec("SELECT * FROM shoppingList");
        const shoppingList = document.getElementById("shoppingList");
        shoppingList.innerHTML = "";
        console.log("Current shopping list:", res);
        if (res.length > 0) {
          res[0].values.forEach(([id, item]) => {
            const li = document.createElement("li");
            li.innerHTML = `${item} 
            <select> <option value="high" class="high">High</option> 
              <option value="medium" class="medium">Medium</option> 
              <option value="low" class="low">Low</option>
            </select><button onclick="remove(${id})" style="cursor: pointer;">X</button>`;
            shoppingList.appendChild(li);
          });
        } else {
          shoppingList.innerHTML = "<li class=\"empty\">No list.</li>";
        }
      }
      function remove(id) {
        db.run("DELETE FROM shoppingList WHERE id = ?", [id]);
        displayShoppingList();
      }
       function editItem(index, newValue) {
      list[index].item = newValue;
      renderList();
      displayShoppingList();
    }



    
    </script>
  </body>
</html>
